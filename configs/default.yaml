
# Shared configuration for baseline and proposed models.
# Keep all settings identical except model.* for fair comparison.

project:
  drive_root: /content/drive/MyDrive/Nighttime_Flare_Removal_Colab
  data_root: /content/flare_data
  seed: 42

data:
  # Reserved for the reusable pre-generated-pair dataset loader.
  # Current Colab workflow supplies DataLoaders directly.
  pairs_root: /content/flare_pairs
  input_dir_name: input
  target_dir_name: target

  crop_size: 256
  batch_size: 4
  num_workers: 2
  val_fraction: 0.2

  group_separator: "__"
  split_file: splits/split_seed42.json

model:
  name: unet
  base_channels: 32
  depth: 4
  dilations: [1, 2, 4]

train:
  epochs: 20
  lr: 1.0e-4
  optimizer: adam
  loss: l1
  ssim_weight: 0.1
  amp: true
  grad_clip: 1.0

eval:
  batch_size: 1
